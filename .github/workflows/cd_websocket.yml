name: Deploy the websocket
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push websocket image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/Dockerfile.websocket
          push: true
          tags: nishaaddhabale/freeflow-websocket:${{ github.sha }}

      - run: |
           echo "${{ secrets.SSH_PRIVATE_KEY }}" &> ~/ssh_key
           mkdir -p /home/runner/.ssh
           ls /home/runner/.ssh
           touch /home/runner/.ssh/known_hosts
           echo "${{ secrets.KNOWN_HOSTS }}" &> /home/runner/.ssh/known_hosts
           chmod 700 /home/runner/ssh_key
           ssh -o StrictHostKeyChecking=no -i ~/ssh_key ubuntu@43.204.144.137 -t "(docker rm -f freeflow_websocket || true) && docker run --name freeflow_websocket -d -p 8080:8080 nishaaddhabale/freeflow-websocket:${{ github.sha }}"